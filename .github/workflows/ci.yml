name: RyCenter

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: clang-format --dry-run --Werror src/*.cpp src/*.h tests/*.cpp
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Geometry and shortcut tests
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build native executable and tests
        run: cmake --build build --config Release --parallel
      - name: Geometry and Win32 integration tests
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RyCenter-native-ui
          path: build/settings-*.png
          if-no-files-found: warn
      - name: Package portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item build/Release/RyCenter.exe, README.md, LICENSE package/
          Get-FileHash package/RyCenter.exe -Algorithm SHA256 | Format-List
          (Get-Item package/RyCenter.exe).Length
      - uses: actions/upload-artifact@v4
        with:
          name: RyCenter-windows-x64
          path: package/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [portable-tests, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RyCenter-windows-x64
          path: package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          exe="RyCenter_${version}_x64_portable.exe"
          mv package/RyCenter.exe "$exe"
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" "$exe" --title "RyCenter $version for Windows" --notes-from-tag --latest
